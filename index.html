
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百年山大 - 沉浸式校园导览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jadeBlue: '#126e82',
                        harvestGreen: '#d2b116',
                        paperWhite: '#F9F5F0',
                        inkBlack: '#1A1A1A',
                        sxuRed: '#b22222'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F9F5F0;
            color: #1A1A1A;
            overflow-x: hidden;
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
        }
        .glass-morphism {
            background: rgba(249, 245, 240, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(18, 110, 130, 0.1);
            position: relative;
        }
        .glass-morphism::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(18, 110, 130, 0.05);
            pointer-events: none;
            border-radius: inherit;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .transition-page {
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "three": "https://esm.sh/three@^0.182.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
